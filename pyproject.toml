[project]
name = "od-toirog-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "httpx==0.28.1",
  "pyswisseph==2.10.3.2",
  "timezonefinder==6.5.9",
  "tzdata==2026.4",
  "pydantic==2.11.5",
  "python-dotenv==1.1.0",
  "sentry-sdk[fastapi]==2.29.1",
  "skyfield==1.54",
  "jplephem==2.24",
  "sgp4==2.27",
  "numpy==2.5.3",
  "od-toirog-engine==0.1.0"
]

[tool.uv]
package = false

[tool.uv.sources]
od-toirog-engine = { path = "vendor/od-toirog-engine", editable = false }

[tool.vercel]
entrypoint = "apps.api.main:app"

[tool.vercel.scripts]
build = "python scripts/build_backend.py"
