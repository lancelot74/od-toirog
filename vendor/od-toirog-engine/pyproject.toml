[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "od-toirog-engine"
version = "0.1.0"
description = "Independent calculation and interpretation foundation for Од Тойрог"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "skyfield==1.54", "numpy>=1.26,<3", "fastapi>=0.115,<1",
  "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "tzdata==2026.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1"]

[project.scripts]
od-toirog = "od_toirog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
od_toirog = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses the real local JPL ephemeris"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
